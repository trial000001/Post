name: Daily video

on:
  schedule:
    - cron: "0 15 * * *"   # tous les jours à 15:00 UTC (16h/17h en France)
  workflow_dispatch:        # lancement manuel possible

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Generate video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python generate.py

      - name: Upload video as release asset (public URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-$(date -u +%Y-%m-%d-%H%M)"
          gh release create "$TAG" output/video.mp4 \
            --title "$(jq -r .title output/meta.json)" \
            --notes "$(jq -r .caption output/meta.json)"
          echo "VIDEO_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4" >> "$GITHUB_ENV"

      - name: Send to Make (publishes on YouTube / TikTok / Instagram)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python publish.py

      - name: Save topic history
        run: |
          git config user.name "daily-video-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Update history" && git push)
